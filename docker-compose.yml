# Consolidated home stack: WordPress + MySQL + Cloudflare Tunnel + all home
# services, built from the systemd units in github.com/krispharper/Services.
#
# Values (volumes, UID/GID, ports, VPN string) are taken verbatim from those
# units. UID/GID and config paths intentionally differ per service — preserved
# as-is, not normalized. Secrets are pulled from .env (see .env.example).
#
# Assumes the host bind-mount roots exist on the home server as they do today:
#   /media/Poseidon/...   (media + several configs)
#   /data/...             (configs for sonarr/radarr/overseerr/plex)

services:
  # ======================= WordPress + MySQL + tunnel =======================
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - /data/mysql:/var/lib/mysql
    networks: [internal]

  wordpress:
    image: wordpress:5-php7.4-apache
    restart: unless-stopped
    depends_on: [db]
    volumes:
      - /var/www/html:/var/www/html
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    depends_on: [wordpress, kadm]
    networks: [internal]

  # ============================ kadm =============================
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kadm
      POSTGRES_PASSWORD: ${KADM_DB_PASSWORD}
      POSTGRES_DB: kadm
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadm -d kadm"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [internal]

  kadm:
    image: krispharper/kadm:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # The media app renames directories, writes poster.jpg and deletes files on
    # /media/Poseidon. The image carries no USER directive, so without this it
    # would do all of that as root -- and the NAS squashes root, so those writes
    # fail or land as `nobody`, which is the same trap scripts/backup.sh runs as
    # `kris` to avoid. 1026:100 is what sonarr, radarr and transmission already
    # write as, so files this container renames keep the ownership the rest of
    # the stack expects. The other kadm apps write nothing to disk, so this
    # costs them nothing.
    user: "1026:100"
    environment:
      KADM_DATABASE_URL: postgresql+psycopg://kadm:${KADM_DB_PASSWORD}@postgres:5432/kadm
      KADM_CF_ACCESS_TEAM_DOMAIN: ${KADM_CF_ACCESS_TEAM_DOMAIN}
      KADM_CF_ACCESS_AUD: ${KADM_CF_ACCESS_AUD}
      KADM_SECRET_KEY: ${KADM_SECRET_KEY:-}

      # --- media ---------------------------------------------------------
      # Radarr and Transmission live in the VPN container's namespace, so they
      # are reached at `vpn:<port>` from the internal bridge -- exactly as
      # cloudflared reaches them. kadm itself stays on `internal` and must NOT
      # be given network_mode: "service:vpn": that would take away both its
      # Cloudflare Access route and its Postgres connection.
      KADM_RADARR_URL: http://vpn:7878
      KADM_RADARR_API_KEY: ${KADM_RADARR_API_KEY}
      KADM_TRANSMISSION_URL: http://vpn:9091
      KADM_TRANSMISSION_USERNAME: ${KADM_TRANSMISSION_USERNAME:-}
      KADM_TRANSMISSION_PASSWORD: ${KADM_TRANSMISSION_PASSWORD:-}

      # Required for artwork rather than optional: Apple's iTunes Search API
      # stopped returning movie results, so TMDB is the only working poster
      # source until the Apple path is pointed at a live endpoint again.
      KADM_TMDB_API_KEY: ${KADM_TMDB_API_KEY}
      KADM_OPENSUBTITLES_API_KEY: ${KADM_OPENSUBTITLES_API_KEY:-}

      # Fifteen minutes. The app's own default is 0, which disables the poller
      # outright -- that default exists so a local `docker compose up`, a one-off
      # `docker compose run` and the test suite never poll the real Radarr. This
      # file is what turns it on.
      KADM_MEDIA_POLL_SECONDS: 900
    volumes:
      # Read-WRITE, unlike crashplan's read-only copy of the same share:
      # approving a movie renames its directory and writes a poster into it, and
      # rejecting one deletes it. This mount is what makes the media app
      # possible, and it is the reason for the `user:` line above.
      - /media/Poseidon:/media/Poseidon
      # The SAME films, mounted a second time at the path Radarr uses.
      #
      # This is not redundancy, it is the fix for a real bug: radarr mounts
      # `/media/Poseidon/Movies:/movies`, so `movieFile.path` comes back as
      # `/movies/Some Film (1999)/Some Film.mkv`. kadm takes that path verbatim
      # and opens it, so with only the mount above every single analysis failed
      # with "No such file or directory" -- the file was right there, under a
      # name this container could not see. Matching Radarr's namespace is the
      # convention the whole *arr stack follows for exactly this reason.
      - /media/Poseidon/Movies:/movies
      # Contact sheets and subtitle strips. Under /data rather than
      # /media/Poseidon on purpose: they regenerate from the films in about two
      # minutes each, and CrashPlan backs up only /media/Poseidon -- putting
      # disposable derived images there would pay to store them offsite forever.
      - /data/kadm-media:/data/kadm-media
    networks: [internal]

  # ============================== VPN + clients ==============================
  # The VPN owns the netns; clients join it with network_mode: service:vpn and
  # therefore cannot declare their own ports/networks. cloudflared reaches their
  # UIs at vpn:<port> over the internal network.
  vpn:
    image: krispharper/openvpn-client
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      - VPN_USERNAME=${VPN_USERNAME}
      - VPN_PASSWORD=${VPN_PASSWORD}
    command: ["-v", "nl-amsterdam.privacy.network;${VPN_USERNAME};${VPN_PASSWORD};1198"]
    networks: [internal]

  transmission:
    image: krispharper/transmission
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on: [vpn]
    environment:
      - USERID=1026
      - GROUPID=100
    volumes:
      - /media/Poseidon/Data/transmission:/transmission/info
      - /media/Poseidon/Downloads/Transmission:/transmission/downloads
      - /media/Poseidon/Downloads/Incomplete:/transmission/incomplete

  sonarr:
    image: linuxserver/sonarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on: [vpn]
    environment:
      - PUID=1026
      - PGID=100
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /data/sonarr:/config
      - "/media/Poseidon/Downloads/Temporary Media/TV Shows:/tv"
      - /media/Poseidon/Downloads/Incomplete:/downloads

  radarr:
    image: linuxserver/radarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on: [vpn]
    environment:
      - PUID=1026
      - PGID=100
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /data/radarr:/config
      - /media/Poseidon/Movies:/movies
      - /media/Poseidon/Downloads/Incomplete:/downloads

  jackett:
    image: linuxserver/jackett
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on: [vpn]
    environment:
      - PUID=1026
      - PGID=100
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /media/Poseidon/Data/jackett:/config
      - /media/Poseidon/Data/transmission/torrents:/downloads

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on: [vpn]
    environment:
      - LOG_LEVEL=info

  agregarr:
    image: agregarr/agregarr
    restart: unless-stopped
    network_mode: "service:vpn"
    depends_on: [vpn]
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /data/agregarr:/app/config
      - /media/Poseidon:/media

  # ============================ Standalone media ============================
  overseerr:
    image: linuxserver/overseerr
    restart: unless-stopped
    environment:
      - PUID=1026
      - PGID=100
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /data/overseerr:/config
    networks: [internal]

  plex:
    image: plexinc/pms-docker
    restart: unless-stopped
    hostname: plex-server
    dns:
      - 8.8.8.8
    environment:
      - TZ=America/Chicago
      - PLEX_CLAIM=${PLEX_CLAIM}
      - ADVERTISE_IP=http://192.168.1.102:32400/
      - PLEX_UID=1026
      - PLEX_GID=1000
    ports:
      - "32400:32400/tcp"
      - "1900:1900/udp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
      - "32469:32469/tcp"
    volumes:
      - /data/plex:/config
      - /media/Poseidon:/media
    networks: [internal]

  tautulli:
    image: tautulli/tautulli
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - PUID=1026
      - PGID=1000
    volumes:
      - /media/Poseidon/Data/tautulli:/config
      - "/data/plex/Library/Application Support/Plex Media Server/Logs:/logs:ro"
    networks: [internal]

  crashplan:
    image: jlesage/crashplan-pro:latest
    restart: unless-stopped
    logging:
      options:
        max-size: "4g"
    environment:
      - USER_ID=1026
      - TZ=America/Chicago
      - CRASHPLAN_SRV_MAX_MEM=10000m
    volumes:
      - /media/Poseidon:/storage:ro
      - /media/Poseidon/Data/crashplan:/config
    networks: [internal]

  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped
    hostname: pihole
    environment:
      - TZ=America/Chicago
      - WEBPASSWORD=${PI_HOLE_PASSWORD}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - /media/Poseidon/Data/pihole/etc-pihole:/etc/pihole
      - /media/Poseidon/Data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    networks: [internal]

networks:
  internal:
    driver: bridge
