; Raise PHP's default upload limits (WordPress core defaults are low).
; Keep these UNDER Cloudflare's 100 MB proxied-request-body cap — anything
; larger than that will be rejected at the edge before it reaches WordPress,
; regardless of what PHP allows.
file_uploads = On
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
memory_limit = 256M
